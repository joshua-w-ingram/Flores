<!DOCTYPE html>
<html>
<head>
    <title>Flores - Flower Finder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <h1>🌸 Flores - Flower Finder 🌸</h1>
    <p>By Bella</p>

    <div class="qr-box">
        <p>📱 Scan to share this app!</p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https%3A%2F%2Fjoshua-w-ingram.github.io%2FFlores%2F" alt="QR Code">
    </div>

    <input type="text" id="searchBox" placeholder="What flower do you want to find?">
    <button onclick="searchFlower()">Search!</button>

    <br><br>

    <button onclick="document.getElementById('photoInput').click()" class="photo-btn">📷 My Photos</button>
    <input type="file" id="photoInput" accept="image/*" onchange="checkMyPhoto()" hidden>

    <div id="photoArea"></div>

    <div id="results"></div>

    <script src="flowers.js"></script>
    <script src="app.js"></script>

</body>
</html>
