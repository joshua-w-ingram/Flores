<!DOCTYPE html>
<html>
<head>
    <title>Flores - Flower Finder</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div id="petals"></div>
    <div id="confetti"></div>

    <h1>🌸 Flores - Flower Finder 🌸</h1>
    <p>By Bella</p>
    <div id="flowerCounter" class="flower-counter"></div>

    <div class="qr-box">
        <p>📱 Scan to share this app!</p>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https%3A%2F%2Fjoshua-w-ingram.github.io%2FFlores%2F" alt="QR Code">
    </div>

    <div id="flowerOfDay" class="flower-of-day"></div>

    <input type="text" id="searchBox" placeholder="What flower do you want to find?">
    <button onclick="searchFlower()">Search!</button>

    <br><br>

    <input type="text" id="colorSearch" placeholder="Search by color (pink, yellow, etc.)">
    <button onclick="searchByColor()" class="color-btn">🎨 Find by Color!</button>

    <br><br>

    <button onclick="document.getElementById('photoInput').click()" class="photo-btn">📷 My Photos</button>
    <input type="file" id="photoInput" accept="image/*" onchange="checkMyPhoto()" hidden>

    <button onclick="randomFlower()" class="random-btn">🎲 Surprise Me!</button>

    <button onclick="startQuiz()" class="quiz-btn">🧠 Flower Quiz!</button>

    <button onclick="startMatchingGame()" class="match-btn">🃏 Matching Game!</button>

    <button onclick="showAllFlowers()" class="browse-btn">🌺 Browse All!</button>

    <button onclick="showFavorites()" class="fav-btn">❤️ My Favorites</button>

    <button onclick="showCollection()" class="collect-btn">📋 My Collection</button>

    <div id="photoArea"></div>

    <div id="quizArea"></div>

    <div id="gameArea"></div>

    <div id="results"></div>

    <script src="flowers.js"></script>
    <script src="app.js"></script>

</body>
</html>
